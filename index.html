<style>
:root {
  --zemin: #faf8f5; --yuzey: #ffffff; --metin: #1d1b19; --soluk: #6b645c; --cizgi: #e7e1d9;
  --vurgu: #b4441f; --vurgu-metin: #ffffff; --etiket: #f1ebe3; --yesil: #2f7a4b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --zemin: #151311; --yuzey: #1f1c19; --metin: #f2eee9; --soluk: #a89f95; --cizgi: #34302b;
    --vurgu: #f08a5d; --vurgu-metin: #1d1b19; --etiket: #2b2723; --yesil: #7fcf99;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --zemin: #151311; --yuzey: #1f1c19; --metin: #f2eee9; --soluk: #a89f95; --cizgi: #34302b;
  --vurgu: #f08a5d; --vurgu-metin: #1d1b19; --etiket: #2b2723; --yesil: #7fcf99;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--zemin); color: var(--metin);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.kap { max-width: 760px; margin: 0 auto; padding: 0 16px 48px; }
header { padding: 28px 0 12px; }
h1 { font-size: 1.7rem; margin: 0; letter-spacing: -0.01em; }
.alt { color: var(--soluk); margin: 2px 0 0; font-size: .92rem; }
nav.sekmeler { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0; position: sticky; top: env(safe-area-inset-top, 0px);
  background: var(--zemin); z-index: 2; scrollbar-width: none; }
nav.sekmeler button { flex: none; border: 1px solid var(--cizgi); background: var(--yuzey); color: var(--metin);
  border-radius: 999px; padding: 7px 14px; font: inherit; font-size: .9rem; cursor: pointer; }
nav.sekmeler button[aria-selected="true"] { background: var(--vurgu); color: var(--vurgu-metin); border-color: var(--vurgu); }
.suzgec { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 4px 0 12px; }
.suzgec select, .suzgec label { font: inherit; font-size: .9rem; padding: 8px 10px; border-radius: 10px;
  border: 1px solid var(--cizgi); background: var(--yuzey); color: var(--metin); min-width: 0; }
.suzgec label { display: flex; align-items: center; gap: 8px; }
.sayac { color: var(--soluk); font-size: .88rem; margin: 6px 0 10px; }
.kart { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 14px; padding: 14px 16px;
  margin-bottom: 10px; display: grid; grid-template-columns: 56px 1fr; gap: 12px; }
.saat { font-weight: 700; font-variant-numeric: tabular-nums; }
.saat small { display: block; color: var(--soluk); font-weight: 400; font-size: .75rem; }
.kart h2 { font-size: 1.02rem; margin: 0 0 2px; line-height: 1.35; overflow-wrap: anywhere; }
.yer { color: var(--soluk); font-size: .9rem; margin: 0; }
.etiketler { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 0; padding: 0; list-style: none; }
.etiketler li { background: var(--etiket); border-radius: 6px; padding: 1px 8px; font-size: .78rem; }
.etiketler li.ucretsiz { color: var(--yesil); font-weight: 600; }
.yakin { font-size: .85rem; margin: 8px 0 0; color: var(--soluk); }
.biletler { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.biletler a { text-decoration: none; font-size: .85rem; border: 1px solid var(--vurgu); color: var(--vurgu);
  border-radius: 8px; padding: 4px 10px; }
.biletler a:hover { background: var(--vurgu); color: var(--vurgu-metin); }
.durum { color: var(--vurgu); font-weight: 600; font-size: .8rem; }
h3.festival { font-size: 1rem; margin: 18px 0 8px; }
.bilgi { background: var(--etiket); border-radius: 10px; padding: 10px 14px; font-size: .88rem; margin: 4px 0 0; }
.ara { width: 100%; font: inherit; font-size: .95rem; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--cizgi); background: var(--yuzey); color: var(--metin); margin: 4px 0 8px; }
.harita { height: 65vh; min-height: 320px; border-radius: 14px; border: 1px solid var(--cizgi); margin-bottom: 12px; }
.harita .leaflet-popup-content { color: #1d1b19; }
.bos { text-align: center; color: var(--soluk); padding: 40px 0; }
footer { color: var(--soluk); font-size: .8rem; margin-top: 28px; }
@media (min-width: 560px) { .suzgec { grid-template-columns: repeat(4, 1fr); } }
</style>
